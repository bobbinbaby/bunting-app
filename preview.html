<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunting Previewer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Poppins:wght@900&family=Passion+One:wght@900&family=Cherry+Bomb+One&family=Lilita+One&family=Nunito:wght@900&display=swap" rel="stylesheet">
<script>function setLoadErr(){var e=document.getElementById("loadingMsg");if(e)e.textContent="failed to load - check your connection";}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js" onerror="setLoadErr()"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --pk-l:#f9c8e0; --pk-m:#f4a8cc; --pk-d:#e87ab5;
  --yw:#fef08a; --yw-d:#f5d060;
  --bg:#fdf0f6; --sh:rgba(232,122,181,0.2);
}
body { font-family:'Poppins',sans-serif; background:var(--bg); min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(244,168,204,0.13) 38px,rgba(244,168,204,0.13) 76px),
    repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(244,168,204,0.13) 38px,rgba(244,168,204,0.13) 76px); }

.app { position:relative; z-index:1; max-width:980px; margin:0 auto; padding:22px 16px 80px; }

/* HEADER */
.header { text-align:center; margin-bottom:20px; }
.business-name { font-size:32px; line-height:1.1; color:var(--pk-d); margin-bottom:6px; }
.business-name.passion { font-family:'Passion One',sans-serif; font-weight:900; }
.business-name.cherry  { font-family:'Cherry Bomb One',cursive; }
.business-name.lilita  { font-family:'Lilita One',sans-serif; }
.business-name.nunito  { font-family:'Nunito',sans-serif; font-weight:900; }
.header-sub { font-size:13px; color:var(--pk-d); opacity:.6; }

/* STEPS */
.steps { display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:22px; flex-wrap:wrap; }
.step { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--pk-d); opacity:.55; padding:8px 14px; }
.step.active { opacity:1; }
.step-num { width:22px; height:22px; border-radius:50%; background:var(--pk-l); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--pk-d); flex-shrink:0; }
.step.active .step-num { background:var(--pk-d); color:#fff; }
.step-arrow { color:var(--pk-m); font-size:14px; opacity:.4; }

/* CARD */
.card { background:#fff; border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:0 4px 20px var(--sh); border:2px solid var(--pk-l); }
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.section-title { font-size:11px; font-weight:700; color:var(--pk-d); text-transform:uppercase; letter-spacing:.8px; }

/* BUTTONS */
.btn { font-family:'Poppins',sans-serif; font-size:12px; font-weight:700; padding:8px 16px; border:none; border-radius:50px; cursor:pointer; transition:all .16s; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.btn:active { transform:scale(.97); }
.btn-pink { background:var(--pk-d); color:#fff; }
.btn-pink:hover { filter:brightness(1.06); }
.btn-yellow { background:var(--yw); color:var(--pk-d); border:2px solid var(--yw-d); }
.btn-yellow:hover { background:var(--yw-d); }
.btn-ghost { background:transparent; color:var(--pk-d); border:2px solid var(--pk-l); }
.btn-ghost:hover { border-color:var(--pk-d); background:var(--pk-l); }
.btn-ghost:disabled { opacity:.35; cursor:not-allowed; }
.btn-ghost:disabled:hover { border-color:var(--pk-l); background:transparent; }
.btn-sm { font-size:11px; padding:5px 11px; }
.btn-link { background:none; border:none; font-family:'Poppins',sans-serif; font-size:11px; font-weight:700; color:var(--pk-d); opacity:.5; cursor:pointer; padding:0; text-decoration:underline; }
.btn-link:hover { opacity:.8; }

label { display:block; font-size:11px; font-weight:700; color:var(--pk-d); text-transform:uppercase; letter-spacing:.7px; margin-bottom:4px; }
input[type=text] { font-family:'Poppins',sans-serif; border:2.5px solid var(--pk-l); border-radius:12px; padding:9px 13px; outline:none; color:var(--pk-d); background:var(--bg); transition:border-color .2s; width:100%; }
input[type=text]:focus { border-color:var(--pk-d); }
.letter-input { font-size:17px; font-weight:700; letter-spacing:4px; }
.letter-input::placeholder { letter-spacing:2px; opacity:.35; font-weight:400; }

/* FABRIC PICKER */
.fabrics-grid { display:flex; flex-wrap:wrap; gap:10px; }
.fabric-chip { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; position:relative; }
.fabric-thumb-wrap { position:relative; }
.fabric-thumb { width:62px; height:62px; border-radius:12px; border:2.5px solid var(--pk-l); overflow:hidden; transition:border-color .15s,transform .15s; background:var(--pk-l); }
.fabric-thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .2s; }
.fabric-chip:hover .fabric-thumb { border-color:var(--pk-d); transform:scale(1.05); }
.fabric-chip.deselected .fabric-thumb { opacity:.28; border-color:var(--pk-l); border-width:2.5px; }
.fabric-chip.selected .fabric-thumb { border-color:var(--pk-d); border-width:3px; }
.chip-check { position:absolute; bottom:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--pk-d); display:none; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.chip-check svg { width:10px; height:10px; stroke:#fff; stroke-width:2.5; fill:none; }
.fabric-chip.selected .chip-check { display:flex; }

.chip-name { font-size:9px; font-weight:600; color:var(--pk-d); opacity:.7; max-width:62px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* SELECTED TRAY */
.selected-tray-wrap { border:2px dashed var(--pk-l); border-radius:14px; padding:10px 12px; margin-top:12px; min-height:52px; display:flex; align-items:center; transition:border-color .2s; }
.selected-tray { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.selected-chip { position:relative; cursor:pointer; }
.selected-thumb { width:44px; height:44px; border-radius:9px; overflow:hidden; border:2.5px solid var(--pk-d); transition:transform .15s; }
.selected-thumb:hover { transform:scale(1.06); }
.selected-thumb img { width:100%; height:100%; object-fit:cover; }
.selected-remove { position:absolute; top:-5px; right:-5px; width:16px; height:16px; border-radius:50%; background:var(--pk-d); color:#fff; border:none; font-size:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; }

/* FILTER */
.filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 0 2px; border-top:1.5px solid var(--pk-l); margin-top:12px; }
.filter-label { font-size:11px; font-weight:700; color:var(--pk-d); opacity:.6; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; }
.filter-chips-wrap { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
.fchip { font-size:11px; font-weight:700; padding:5px 12px; border-radius:50px; background:var(--pk-l); color:var(--pk-d); cursor:pointer; border:2px solid transparent; white-space:nowrap; transition:all .15s; }
.fchip:hover { border-color:var(--pk-d); }
.fchip.sel { background:var(--pk-d); color:#fff; border-color:var(--pk-d); }
.fchip .chip-count { opacity:.6; font-size:10px; margin-left:2px; }
.fchip.sel .chip-count { opacity:.8; }
