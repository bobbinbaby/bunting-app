<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunting Previewer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --pk-l:#f9c8e0; --pk-m:#f4a8cc; --pk-d:#e87ab5; --yw:#fef08a; --yw-d:#f5d060; --bg:#fdf0f6; --sh:rgba(232,122,181,0.2); }
body { font-family:'Poppins',sans-serif; background:var(--bg); min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none;
  background-image: repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(244,168,204,0.13) 38px,rgba(244,168,204,0.13) 76px),
  repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(244,168,204,0.13) 38px,rgba(244,168,204,0.13) 76px); }
.app { position:relative; z-index:1; max-width:980px; margin:0 auto; padding:22px 16px 80px; }

/* HEADER */
.header { text-align:center; margin-bottom:24px; }
.business-name { font-size:22px; font-weight:900; color:var(--pk-d); letter-spacing:-0.5px; }
.header-sub { font-size:13px; color:var(--pk-d); opacity:.6; margin-top:4px; }

.card { background:#fff; border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:0 4px 20px var(--sh); border:2px solid var(--pk-l); }
.section-title { font-size:11px; font-weight:700; color:var(--pk-d); text-transform:uppercase; letter-spacing:.8px; margin-bottom:12px; }
.btn { font-family:'Poppins',sans-serif; font-size:12px; font-weight:700; padding:8px 16px; border:none; border-radius:50px; cursor:pointer; transition:all .16s; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.btn:active { transform:scale(.97); }
.btn-pink { background:var(--pk-d); color:#fff; }
.btn-pink:hover { filter:brightness(1.06); }
.btn-yellow { background:var(--yw); color:var(--pk-d); border:2px solid var(--yw-d); }
.btn-yellow:hover { background:var(--yw-d); }
.btn-ghost { background:transparent; color:var(--pk-d); border:2px solid var(--pk-l); }
.btn-ghost:hover { border-color:var(--pk-d); background:var(--pk-l); }
.btn-sm { font-size:11px; padding:5px 11px; }
label { display:block; font-size:11px; font-weight:700; color:var(--pk-d); text-transform:uppercase; letter-spacing:.7px; margin-bottom:4px; }
input[type=text] { font-family:'Poppins',sans-serif; border:2.5px solid var(--pk-l); border-radius:12px; padding:9px 13px; outline:none; color:var(--pk-d); background:var(--bg); transition:border-color .2s; }
input[type=text]:focus { border-color:var(--pk-d); }
.letter-input { font-size:17px; font-weight:700; letter-spacing:4px; width:100%; }
.letter-input::placeholder { letter-spacing:2px; opacity:.35; font-weight:400; }
.toggle-pill { display:flex; background:var(--pk-l); border-radius:50px; padding:3px; gap:2px; }
.toggle-pill button { font-family:'Poppins',sans-serif; font-size:12px; font-weight:700; padding:5px 12px; border:none; border-radius:50px; cursor:pointer; transition:all .2s; background:transparent; color:var(--pk-d); }
.toggle-pill button.active { background:var(--pk-d); color:#fff; }

/* FABRIC PICKER */
.fabrics-scroll { display:flex; flex-wrap:wrap; gap:8px; }
.fabric-chip { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.fabric-thumb { width:56px; height:56px; border-radius:10px; border:2.5px solid var(--pk-l); overflow:hidden; transition:border-color .2s,transform .15s,opacity .15s; }
.fabric-chip:hover .fabric-thumb { border-color:var(--pk-d); transform:scale(1.06); }
.fabric-thumb img { width:100%; height:100%; object-fit:cover; }
.fabric-chip.deselected .fabric-thumb { opacity:.28; }
.fabric-chip.selected .fabric-thumb { border-color:var(--pk-d); border-width:3px; }
.chip-tick { position:relative; }
.chip-check { position:absolute; bottom:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--pk-d); display:none; align-items:center; justify-content:center; }
.chip-check svg { width:9px; height:9px; stroke:#fff; stroke-width:2.5; fill:none; }
.fabric-chip.selected .chip-check { display:flex; }
.chip-name { font-size:8px; font-weight:600; color:var(--pk-d); opacity:.65; max-width:56px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* FILTER CHIPS */
.filter-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 0 2px; border-top:1.5px solid var(--pk-l); margin-top:12px; }
.filter-label { font-size:11px; font-weight:700; color:var(--pk-d); opacity:.7; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; }
.fchip { font-size:11px; font-weight:700; padding:5px 13px; border-radius:50px; background:var(--pk-l); color:var(--pk-d); cursor:pointer; border:2px solid transparent; white-space:nowrap; transition:all .15s; }
.fchip.sel { background:var(--pk-d); color:#fff; border-color:var(--pk-d); }
.fchip.all-chip.sel { background:var(--yw-d); color:var(--pk-d); border-color:var(--yw-d); }
.pool-count { font-size:11px; color:var(--pk-d); opacity:.5; margin-left:auto; white-space:nowrap; }

/* PREVIEW */
.preview-area { background:#fff; border-radius:20px; padding:18px 14px 28px; box-shadow:0 4px 20px var(--sh); border:2px solid var(--pk-l); min-height:200px; position:relative; overflow:hidden; }
.preview-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.preview-title { font-size:11px; font-weight:700; color:var(--pk-d); text-transform:uppercase; letter-spacing:.8px; }
.preview-actions { display:flex; gap:6px; align-items:center; }
.bunting-string-line { position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent 1%,#c084a8 8%,#c084a8 92%,transparent 99%); z-index:1; display:none; }
.bunting-wrap { display:flex; flex-wrap:nowrap; justify-content:center; padding-top:20px; position:relative; z-index:2; min-height:170px; align-items:flex-start; overflow-x:auto; }
.flag-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; transition:transform .18s; position:relative; flex-shrink:0; }
.flag-item:hover { transform:translateY(-4px) rotate(-2deg); }
.flag-item.locked::after { content:'🔒'; position:absolute; bottom:4px; right:2px; font-size:9px; pointer-events:none; }
.flag-string { width:2px; background:#c084a8; }
.letter-flag { position:relative; flex-shrink:0; overflow:visible; }
.flag-space { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--pk-m); font-size:13px; padding:30px 20px; text-align:center; min-height:170px; width:100%; }
.empty-state svg { width:44px; height:44px; opacity:.4; }
.warn { width:100%; text-align:center; padding:40px 20px; font-size:12px; color:var(--pk-d); opacity:.6; }

/* LOADING / ERROR */
.full-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; gap:12px; color:var(--pk-d); font-size:14px; opacity:.7; }

/* TOAST */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--pk-d); color:#fff; font-size:13px; font-weight:700; padding:10px 22px; border-radius:50px; z-index:300; opacity:0; transition:opacity .25s,transform .25s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="loadingScreen" class="full-screen">
  <div style="font-size:28px;">🧵</div>
  <div>loading fabrics...</div>
</div>

<div id="errorScreen" class="full-screen" style="display:none">
  <div style="font-size:36px;">🤷</div>
  <div id="errorMsg">maker not found</div>
  <a href="/" style="color:var(--pk-d);font-weight:700;">go home</a>
</div>

<div id="mainApp" style="display:none">
  <div class="app">
    <div class="header">
      <div class="business-name" id="businessName"></div>
      <div class="header-sub">design your own bunting ✨</div>
    </div>

    <!-- FABRIC PICKER -->
    <div class="card">
      <div class="section-title">choose your fabrics</div>
      <div class="fabrics-scroll" id="fabricsGrid"></div>
      <div class="filter-bar" id="filterBar" style="display:none">
        <span class="filter-label">filter</span>
        <div id="filterChips" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        <span class="pool-count" id="poolCount"></span>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="card">
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
        <div style="flex:1;min-width:180px;">
          <label>your letters</label>
          <input type="text" class="letter-input" id="letterInput" placeholder="e.g. MAYA" maxlength="30" oninput="onLetterInput()">
        </div>
        <div>
          <label>case</label>
          <div class="toggle-pill">
            <button id="btnUpper" class="active" onclick="setCase('upper')">Aa UPPER</button>
            <button id="btnLower" onclick="setCase('lower')">aa lower</button>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-yellow" onclick="randomiseFabrics()">randomise fabrics</button>
        <button class="btn btn-pink" onclick="randomiseFabrics()">shuffle all</button>
        <button class="btn btn-ghost" onclick="clearAll()">clear</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-area" id="previewArea">
      <div class="preview-header">
        <span class="preview-title">preview</span>
        <div class="preview-actions" id="previewActions" style="display:none">
          <button class="btn btn-sm btn-ghost" id="downloadBtn" onclick="downloadBunting()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 19h14M19 13l-7 7-7-7"/></svg>
            download
          </button>
        </div>
      </div>
      <div class="bunting-string-line" id="buntingStringLine"></div>
      <div class="bunting-wrap" id="buntingWrap">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <div>select fabrics above &amp; type your letters<br>to preview your bunting!</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://xrdoigayaxwbltsprwmq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyZG9pZ2F5YXh3Ymx0c3Byd21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTI2NTEsImV4cCI6MjA5NTIyODY1MX0.QF37ru2AGJCVsVb_tZ9MRRjsKrzD7QEI-ZFX6Y3m4fo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allFabrics = [];      // all maker fabrics (in_pool = true ones shown)
let selectedIds = new Set(); // customer's chosen subset
let activeFilters = new Set();
let letterFabricMap = {};
let lockedKeys = new Set();
let currentCase = 'upper';
let fontsReady = false;
let FLAG_W=100, FLAG_H=100, CANVAS_W=100, CANVAS_H=100, SPACE_W=36, STR_H=18, FONT_SIZE=120;
const FONT_SCALE_UPPER=1.538, FONT_SCALE_LOWER=1.462;

// ── INIT ──────────────────────────────────────────────────
async function init() {
  // Get slug from URL path e.g. /preview/bobbinbaby
  const slug = window.location.pathname.split('/').filter(Boolean).pop();
  if (!slug) { showError('no maker link provided'); return; }

  // Look up maker
  const { data: maker, error } = await sb.from('makers').select('*').eq('slug', slug).maybeSingle();
  if (error || !maker) { showError('maker "' + slug + '" not found'); return; }

  document.title = maker.business_name + ' — Bunting Previewer';
  document.getElementById('businessName').textContent = maker.business_name || maker.slug;

  // Load fabrics (only in_pool ones)
  const { data: fabrics } = await sb.from('fabrics').select('*').eq('maker_id', maker.id).eq('in_pool', true).order('sort_order').order('created_at');
  allFabrics = fabrics || [];

  if (!allFabrics.length) { showError('this maker hasn\'t added any fabrics yet — check back soon!'); return; }

  // All fabrics selected by default
  allFabrics.forEach(f => selectedIds.add(f.id));

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

  renderFabricPicker();
  renderFilterBar();
  await document.fonts.ready;
  fontsReady = true;
  calcFlagSize();
  renderBunting();
}

function showError(msg) {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorScreen').style.display = 'flex';
}

// ── SIZING ────────────────────────────────────────────────
function calcFlagSize() {
  const area = document.getElementById('previewArea'); if(!area) return;
  const innerW = area.clientWidth - 28;
  FLAG_W = Math.floor((innerW - 8) / 9);
  SPACE_W = Math.round(FLAG_W * 0.38);
  STR_H = Math.round(FLAG_W * 0.18);
  const scale = currentCase==='upper' ? FONT_SCALE_UPPER : FONT_SCALE_LOWER;
  FONT_SIZE = Math.round(FLAG_W * scale);
  const probe = document.createElement('canvas');
  probe.width = FONT_SIZE*3; probe.height = FONT_SIZE*3;
  const pctx = probe.getContext('2d');
  pctx.font = `900 ${FONT_SIZE}px 'Poppins',sans-serif`;
  const m = pctx.measureText('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz');
  const ascent  = m.actualBoundingBoxAscent  > 0 ? m.actualBoundingBoxAscent  : FONT_SIZE*0.78;
  const descent = m.actualBoundingBoxDescent > 0 ? m.actualBoundingBoxDescent : FONT_SIZE*0.22;
  const pad = Math.round(FONT_SIZE * 0.08);
  CANVAS_H = Math.ceil(ascent + descent + pad*2);
  FLAG_H = CANVAS_H;
  let maxW = 0;
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{ const w=pctx.measureText(ch).width; if(w>maxW)maxW=w; });
  CANVAS_W = Math.ceil(Math.max(FLAG_W, maxW) + Math.round(FONT_SIZE*0.06)*2);
}
window.addEventListener('resize', () => { calcFlagSize(); renderBunting(); });

// ── FABRIC PICKER ─────────────────────────────────────────
function toggleFabric(id) {
  if (selectedIds.has(id)) {
    if (selectedIds.size === 1) { showToast('select at least one fabric'); return; }
    selectedIds.delete(id);
  } else { selectedIds.add(id); }
  renderFabricPicker();
  const pool = getPool();
  getTokens().forEach(t => {
    if (t.type!=='letter'||lockedKeys.has(t.key)) return;
    if (!selectedIds.has(letterFabricMap[t.key])) letterFabricMap[t.key] = pool[Math.floor(Math.random()*pool.length)]?.id;
  });
  renderBunting();
}

function renderFabricPicker() {
  const grid = document.getElementById('fabricsGrid');
  grid.innerHTML = allFabrics.map(f => {
    const isSel = selectedIds.has(f.id);
    return `<div class="fabric-chip ${isSel?'selected':'deselected'}" onclick="toggleFabric('${f.id}')">
      <div class="chip-tick">
        <div class="fabric-thumb"><img src="${f.public_url}" alt="${esc(f.name)}" loading="lazy"></div>
        <div class="chip-check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
      </div>
      <span class="chip-name">${esc(f.name)}</span>
    </div>`;
  }).join('');
}

// ── TAG FILTER ────────────────────────────────────────────
function getAllTags() { const s=new Set(); allFabrics.forEach(f=>(f.tags||[]).forEach(t=>s.add(t))); return [...s].sort(); }
function renderFilterBar() {
  const bar=document.getElementById('filterBar'), tags=getAllTags();
  if (!tags.length) { bar.style.display='none'; return; }
  bar.style.display='flex';
  activeFilters.forEach(t=>{ if(!tags.includes(t)) activeFilters.delete(t); });
  let html=`<span class="fchip all-chip${activeFilters.size===0?' sel':''}" onclick="clearFilters()">all</span>`;
  tags.forEach(t=>{ html+=`<span class="fchip${activeFilters.has(t)?' sel':''}" onclick="toggleFilter('${esc(t)}')">${esc(t)}</span>`; });
  document.getElementById('filterChips').innerHTML = html;
  const pool=getPool();
  document.getElementById('poolCount').textContent = activeFilters.size>0 ? pool.length+' of '+allFabrics.length+' fabrics' : '';
}
function toggleFilter(tag) {
  activeFilters.has(tag)?activeFilters.delete(tag):activeFilters.add(tag);
  renderFilterBar(); renderFabricPicker();
  if (getTokens().length>0) renderBunting();
}
function clearFilters() { activeFilters.clear(); renderFilterBar(); renderFabricPicker(); if(getTokens().length>0)renderBunting(); }

function getPool() {
  let pool = allFabrics.filter(f=>selectedIds.has(f.id));
  if (activeFilters.size>0) pool = pool.filter(f=>(f.tags||[]).some(t=>activeFilters.has(t)));
  return pool.length>0 ? pool : allFabrics.filter(f=>selectedIds.has(f.id));
}

// ── LETTERS ───────────────────────────────────────────────
function getTokens() {
  return document.getElementById('letterInput').value.split('').map((ch,i)=>({type:ch===' '?'space':'letter',char:ch,key:i+':'+ch}));
}
function setCase(c) { currentCase=c; document.getElementById('btnUpper').classList.toggle('active',c==='upper'); document.getElementById('btnLower').classList.toggle('active',c==='lower'); calcFlagSize();renderBunting(); }
function onLetterInput() {
  const tokens=getTokens(); const vk=new Set(tokens.map(t=>t.key));
  Object.keys(letterFabricMap).forEach(k=>{if(!vk.has(k))delete letterFabricMap[k];});
  lockedKeys.forEach(k=>{if(!vk.has(k))lockedKeys.delete(k);});
  renderBunting();
}
function randomiseFabrics() {
  const pool=getPool(); if(!pool.length){renderBunting();return;}
  getTokens().forEach(t=>{if(t.type!=='letter'||lockedKeys.has(t.key))return; letterFabricMap[t.key]=pool[Math.floor(Math.random()*pool.length)].id;});
  renderBunting();
}
function clearAll() { document.getElementById('letterInput').value=''; letterFabricMap={}; lockedKeys.clear(); renderBunting(); }
function toggleLock(key) { lockedKeys.has(key)?lockedKeys.delete(key):lockedKeys.add(key); renderBunting(); }

// ── RENDER BUNTING ────────────────────────────────────────
function renderBunting() {
  if (!fontsReady) return;
  const tokens=getTokens(), pool=getPool();
  const wrap=document.getElementById('buntingWrap'), strLine=document.getElementById('buntingStringLine'), acts=document.getElementById('previewActions');
  const lts=tokens.filter(t=>t.type==='letter');
  if (!tokens.length) {
    wrap.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><div>select fabrics above &amp; type your letters<br>to preview your bunting!</div></div>';
    strLine.style.display='none'; acts.style.display='none'; return;
  }
  if (!pool.length&&lts.length) {
    wrap.innerHTML='<div class="warn">select at least one fabric above to preview!</div>';
    strLine.style.display='none'; acts.style.display='none'; return;
  }
  strLine.style.top=(18+6+20+STR_H/2)+'px'; strLine.style.display='block'; acts.style.display='flex';
  wrap.innerHTML='';
  tokens.forEach(token=>{
    if (token.type==='space') {
      const sp=document.createElement('div'); sp.className='flag-space'; sp.style.width=SPACE_W+'px';
      const se=document.createElement('div'); se.style.height=STR_H+'px'; se.style.width='2px';
      const gap=document.createElement('div'); gap.style.width=SPACE_W+'px'; gap.style.height=FLAG_H+'px';
      sp.appendChild(se); sp.appendChild(gap); wrap.appendChild(sp); return;
    }
    const cur=allFabrics.find(f=>f.id===letterFabricMap[token.key]);
    const inPool=cur&&pool.find(f=>f.id===cur.id);
    if (!inPool&&pool.length&&!lockedKeys.has(token.key)) letterFabricMap[token.key]=pool[Math.floor(Math.random()*pool.length)].id;
    const fabric=allFabrics.find(f=>f.id===letterFabricMap[token.key])||pool[0]||null;
    const isLocked=lockedKeys.has(token.key);
    const item=document.createElement('div'); item.className='flag-item'+(isLocked?' locked':'');
    item.title=isLocked?'click to unlock':'click to cycle · shift+click to lock';
    item.onclick=e=>{ if(e.shiftKey){toggleLock(token.key);}else if(!isLocked){cycleFabric(token.key);}else{toggleLock(token.key);} };
    const str=document.createElement('div'); str.className='flag-string'; str.style.height=STR_H+'px';
    const flag=document.createElement('div'); flag.className='letter-flag'; flag.style.width=FLAG_W+'px'; flag.style.height=FLAG_H+'px'; flag.style.overflow='visible';
    item.appendChild(str); item.appendChild(flag); wrap.appendChild(item);
    drawLetterFlag(flag, token.char, fabric?fabric.public_url:null);
  });
}

function cycleFabric(key) {
  const pool=getPool(); if(pool.length<=1)return;
  const idx=pool.findIndex(f=>f.id===letterFabricMap[key]);
  letterFabricMap[key]=pool[(idx+1)%pool.length].id;
  const tokens=getTokens().filter(t=>t.type==='letter');
  const ti=tokens.findIndex(t=>t.key===key);
  const items=document.querySelectorAll('.flag-item');
  if (items[ti]) { const flag=items[ti].querySelector('.letter-flag'); if(flag){flag.innerHTML='';const f=allFabrics.find(f=>f.id===letterFabricMap[key]);drawLetterFlag(flag,tokens[ti].char,f?f.public_url:null);} }
}

// ── CANVAS ────────────────────────────────────────────────
function drawLetterFlag(container, letter, fabricUrl) {
  const W=CANVAS_W, H=CANVAS_H, S=2;
  const canvas=document.createElement('canvas');
  canvas.width=W*S; canvas.height=H*S; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  canvas.style.position='relative'; canvas.style.left=((FLAG_W-W)/2)+'px';
  container.appendChild(canvas);
  const ctx=canvas.getContext('2d'); ctx.scale(S,S);
  const displayLetter=currentCase==='upper'?letter.toUpperCase():letter.toLowerCase();
  const font=`900 ${FONT_SIZE}px 'Poppins',sans-serif`;
  function render(img) {
    ctx.clearRect(0,0,W,H);
    ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(150,140,145,0.38)';
    ctx.fillText(displayLetter, W/2+1.5, H/2+1.5);
    const off=document.createElement('canvas'); off.width=W; off.height=H;
    const ox=off.getContext('2d');
    ox.font=font; ox.textAlign='center'; ox.textBaseline='middle';
    ox.fillStyle='#000'; ox.fillText(displayLetter,W/2,H/2);
    ox.globalCompositeOperation='source-in';
    if(img){ox.drawImage(img,0,0,W,H);}else{ox.fillStyle='#fef08a';ox.fillRect(0,0,W,H);}
    ctx.drawImage(off,0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1;
    ctx.strokeText(displayLetter,W/2,H/2);
  }
  if(fabricUrl){const img=new Image();img.crossOrigin='anonymous';img.onload=()=>render(img);img.onerror=()=>render(null);img.src=fabricUrl;}
  else{render(null);}
}

// ── DOWNLOAD ──────────────────────────────────────────────
function downloadBunting() {
  const tokens=getTokens(); if(!tokens.length)return;
  const btn=document.getElementById('downloadBtn'); btn.textContent='preparing...'; btn.disabled=true;
  const GAP=1,PAD=20,FW=FLAG_W,FH=FLAG_H,SP_W=SPACE_W,SH=STR_H;
  let totalW=PAD*2; tokens.forEach(t=>{totalW+=(t.type==='space'?SP_W:FW)+GAP;}); totalW-=GAP;
  const totalH=FH+SH+PAD*2;
  const lc=tokens.filter(t=>t.type==='letter').length;
  function allReady(){return document.querySelectorAll('.letter-flag canvas').length===lc;}
  function doDownload(){
    const out=document.createElement('canvas'); out.width=totalW*2; out.height=totalH*2;
    const ctx=out.getContext('2d'); ctx.scale(2,2);
    ctx.fillStyle='#fdf0f6'; ctx.fillRect(0,0,totalW,totalH);
    ctx.strokeStyle='#c084a8'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(PAD,PAD+SH/2); ctx.lineTo(totalW-PAD,PAD+SH/2); ctx.stroke();
    let x=PAD, ci=0; const lcs=document.querySelectorAll('.letter-flag canvas');
    tokens.forEach(t=>{
      if(t.type==='space'){x+=SP_W+GAP;return;}
      const fc=lcs[ci++]; const cx=x+FW/2;
      ctx.strokeStyle='#c084a8'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cx,PAD+SH/2); ctx.lineTo(cx,PAD+SH); ctx.stroke();
      if(fc) ctx.drawImage(fc,x,PAD+SH,FW,FH);
      x+=FW+GAP;
    });
    const link=document.createElement('a'); link.download='my-bunting.png'; link.href=out.toDataURL('image/png'); link.click();
    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 19h14M19 13l-7 7-7-7"/></svg> download';
    btn.disabled=false;
  }
  let attempts=0; function tryDownload(){if(allReady()||attempts>30){doDownload();return;}attempts++;setTimeout(tryDownload,100);} tryDownload();
}

function showToast(msg,d=2200){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

init();
</script>
